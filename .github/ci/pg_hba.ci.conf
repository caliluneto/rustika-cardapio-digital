# pg_hba.conf do PostgreSQL EFÊMERO do GitHub Actions. Só existe no runner descartável.
# As cinco primeiras regras são as de backend/docs/sql/pg_hba-test-fixtures.conf.example (a role de
# fixtures só conecta em cardapio_digital_test, por SCRAM, via loopback; recusada em todo o resto).
# Nenhuma regra usa USER "all" nem grupos (+) ou regex (/): exigência de enable-test-fixtures-login.sql.
host    cardapio_digital_test  cardapio_test_fixtures   127.0.0.1/32   scram-sha-256
host    cardapio_digital_test  cardapio_test_fixtures   ::1/128        scram-sha-256
local   all                    cardapio_test_fixtures                  reject
host    all                    cardapio_test_fixtures   127.0.0.1/32   reject
host    all                    cardapio_test_fixtures   ::1/128        reject

# Roles do projeto: somente banco Test e shadow (migrator), somente loopback, somente SCRAM.
host    cardapio_digital_test  cardapio_test_app        127.0.0.1/32   scram-sha-256
host    cardapio_digital_test  cardapio_migrator        127.0.0.1/32   scram-sha-256
host    cardapio_digital_shadow cardapio_migrator       127.0.0.1/32   scram-sha-256

# Administração do container (socket Unix dentro do container; nunca exposto por TCP).
local   all                    postgres                                trust
