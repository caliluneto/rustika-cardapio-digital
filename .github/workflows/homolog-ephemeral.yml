# RÚSTIKA — Ensaio efêmero da homologação. PREPARADO, NÃO EXECUTADO. Revisar antes do primeiro disparo.
#
# - Workflow EXCLUSIVO e MANUAL (workflow_dispatch) com opt-in `run_homolog_ephemeral`, inicialmente false.
#   Nunca roda em push, pull_request, schedule ou workflow_run. Não compartilha o PostgreSQL do job `e2e` do ci.yml.
# - Cria um PostgreSQL 18 PRÓPRIO e descartável no runner (TLS com CA sintética, IP não-loopback) e executa SOMENTE a suíte
#   tests/homolog-ephemeral. Nenhum secret do repositório; credenciais e certificados são gerados na execução e mascarados.
# - Valida a identidade do servidor (cluster_name, TLS, banco vazio) antes da primeira escrita; descarta tudo ao final (always()).
# - Não anexa artifacts, dumps nem logs de credenciais. Timeout curto. Recusa repositório público.
# - Documentação: backend/docs/homologation-environment.md (seção "Ensaio efêmero").
name: homolog-ephemeral

on:
  workflow_dispatch:
    inputs:
      run_homolog_ephemeral:
        description: 'Executar o ensaio efêmero da homologação (escreve SOMENTE no PostgreSQL descartável criado neste job)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: homolog-ephemeral
  cancel-in-progress: false

jobs:
  homolog-ephemeral:
    if: github.event_name == 'workflow_dispatch' && inputs.run_homolog_ephemeral == true && github.event.repository.private == true
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PG_CONTAINER: pg-homolog-ephemeral
      RUSTIKA_HOMOLOG_EPHEMERAL_REQUIRED: '1'
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Pré-condições do runner (porta livre, nenhuma URL de banco no ambiente)
        run: |
          if ss -ltn "( sport = :55432 )" | grep -q LISTEN; then echo "Porta 55432 ocupada"; exit 1; fi
          for var in DATABASE_URL SHADOW_DATABASE_URL CARDAPIO_SECRETS_DIR DB_PROFILE CARDAPIO_MIGRATE_DEPLOY_CONFIRMATION CARDAPIO_MIGRATE_HOMOLOG_CONFIRMATION CARDAPIO_MIGRATE_HOMOLOG_REPLAY_CONFIRMATION; do
            if [ -n "${!var:-}" ]; then echo "$var não pode estar definida"; exit 1; fi
          done
          for script in start-ephemeral-postgres diagnostics teardown; do bash -n "ops/homolog/ci/${script}.sh"; done

      - name: Instalar dependências
        run: |
          npm ci
          npx prisma generate

      - name: Subir o PostgreSQL 18 descartável (TLS, CA sintética, IP não-loopback)
        run: bash ops/homolog/ci/start-ephemeral-postgres.sh

      - name: Ensaio efêmero da homologação (somente tests/homolog-ephemeral)
        env:
          # O processo de teste usa os gates de teste do projeto; os wrappers recebem perfis de homologação por pasta de segredos própria.
          # (src/config/env.ts exige DB_PROFILE=app-test sob NODE_ENV=test; o perfil só nomeia o gate, não carrega segredo algum.)
          NODE_ENV: test
          DB_PROFILE: app-test
        run: npm run test:homolog:ephemeral

      - name: Diagnóstico seguro (somente em falha; sem dumps, sem artifacts)
        if: failure()
        run: bash ops/homolog/ci/diagnostics.sh

      - name: Descartar o ambiente efêmero (sempre)
        if: always()
        run: bash ops/homolog/ci/teardown.sh
